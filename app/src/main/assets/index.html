<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c6b4a">
<style>:root{color-scheme:light}[hidden]{display:none!important}body{margin:0}</style>
<title>Km e Despesas de Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: folha de prestação de contas. Barra fixa com abas e a diferença corrente; lançamentos como linhas compactas de livro-caixa. */
:root{
  --bg:#f1f4f2; --surface:#ffffff; --ink:#15201a; --muted:#58695f; --line:#d6dfda;
  --accent:#1c6b4a; --accent-ink:#ffffff; --accent-soft:#e1f0e8;
  --warn:#8f5200; --warn-bg:#fff0d6; --bad:#b3261e;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1511; --surface:#161f19; --ink:#e5ece8; --muted:#92a399; --line:#2a3830;
    --accent:#5cc79a; --accent-ink:#08140e; --accent-soft:#1b2c23;
    --warn:#f0b35a; --warn-bg:#2b2211; --bad:#ff8d83; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#161f19; --ink:#e5ece8; --muted:#92a399; --line:#2a3830;
  --accent:#5cc79a; --accent-ink:#08140e; --accent-soft:#1b2c23;
  --warn:#f0b35a; --warn-bg:#2b2211; --bad:#ff8d83; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:980px;margin-inline:auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{padding-block:20px 12px;display:grid;gap:12px}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h1{font-size:clamp(1.4rem,4.5vw,1.9rem);font-weight:700;letter-spacing:-.01em}
.status{font-size:.8rem;color:var(--muted)}
.status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.status.busy::before{background:var(--warn)}

details.ident{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.ident>summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 14px;list-style:none;align-items:center}
details.ident>summary::-webkit-details-marker{display:none}
details.ident>summary::after{content:"Editar";margin-left:auto;color:var(--accent);font-weight:600;font-size:.85rem}
details.ident[open]>summary::after{content:"Fechar"}
.ident-sum{display:flex;flex-wrap:wrap;gap:2px 14px;min-width:0}
.ident-sum b{font-weight:600}
.ident-form{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;padding:4px 14px 14px}

nav.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 6px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;min-height:42px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.ledger{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;padding-top:8px;font-size:.88rem;color:var(--muted)}
.ledger strong{color:var(--ink);font-weight:600}
[data-state="pos"]{color:var(--accent)!important}
[data-state="neg"]{color:var(--bad)!important}

main{display:grid;gap:22px;padding-top:18px}
.sec{display:grid;gap:10px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sh h3{font-size:1.15rem;font-weight:700}
.tot{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums}
.rows{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:repeat(12,1fr);gap:8px 10px;padding:10px 14px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rh{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
.ri{font-family:var(--font-mono);font-size:.78rem;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.82rem;padding:4px 6px;border-radius:6px}
.del:hover{color:var(--bad)}
.del.arm{background:var(--bad);color:#fff}
.f{grid-column:span var(--s);display:grid;gap:3px;min-width:0;align-content:start}
.f>span{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f output{width:100%;min-height:40px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);min-width:0}
.f input[type=number],.f output{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.f output{display:flex;align-items:center;background:var(--accent-soft);border-color:transparent;font-weight:500}
.empty{margin:0;padding:18px 14px;color:var(--muted)}
.add{justify-self:start;min-height:42px;padding:8px 16px;border:1px dashed var(--accent);border-radius:8px;background:none;color:var(--accent);font-weight:600;cursor:pointer}
.add:hover{background:var(--accent-soft)}
.kmrate{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kmrate .f{grid-column:auto}
.notice{margin:0;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:.9rem}

.eq{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:6px}
.card h3{font-size:1rem;color:var(--muted);font-weight:600}
.big{font-family:var(--font-display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.line{display:flex;justify-content:space-between;gap:12px;font-size:.92rem}
.line span:first-child{color:var(--muted)}
.result{background:var(--ink);color:var(--bg);border-radius:12px;padding:18px;display:grid;gap:4px}
.result .big{font-size:2.4rem;color:var(--bg)!important}
.result .verdict{font-weight:600;font-size:1.05rem}
.result [data-state]{color:inherit!important}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:44px;padding:8px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);font-size:.9rem;z-index:20}

@media (min-width:641px){ .eq{grid-template-columns:repeat(3,1fr)} .result{grid-column:1/-1} }
@media (max-width:640px){
  .f{grid-column:span 6}
  .f.wide{grid-column:span 12}
  .ident-form .f{grid-column:span 12}
  .ident-form .f.half{grid-column:span 6}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>window.addEventListener("error",function(e){var b=document.createElement("div");b.style.cssText="position:fixed;left:0;right:0;top:0;background:#b3261e;color:#fff;padding:8px 12px;font:13px sans-serif;z-index:99";b.textContent="Erro no app: "+e.message+" (linha "+(e.lineno||"?")+")";(document.body||document.documentElement).appendChild(b)})</script>
<noscript><p style="padding:16px;font:15px sans-serif">Ative o JavaScript do navegador para usar o app.</p></noscript>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-row">
      <h1>Km e Despesas de Campo</h1>
      <span class="status" id="status" role="status">Carregando…</span>
    </div>
    <details class="ident" id="ident">
      <summary><span class="ident-sum" id="identSum"></span></summary>
      <div class="ident-form" id="identForm"></div>
    </details>
  </header>

  <nav class="bar" aria-label="Seções do relatório">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="ledger">
      <span>Diferença <strong class="num" data-t="diff"></strong></span>
      <span data-t="verdict" data-verdict></span>
    </div>
  </nav>

  <main id="app"></main>
</div>
<div id="toast" hidden role="status"></div>

/* ---------- cálculos ---------- */
function totals(){
  var sum=function(a){return a.reduce(function(x,r){return x+num(r.valor)},0)};
  var kmTot=S.km.reduce(function(x,r){return x+kmRod(r)},0), kmVal=kmTot*num(S.h.valorKm);
  var T={kmTot:kmTot,kmVal:kmVal,alim:sum(S.alim),hosp:sum(S.hosp),comb:sum(S.comb),outras:sum(S.outras),advV:sum(S.advV),advC:sum(S.advC),advO:sum(S.advO)};
  T.desp=T.alim+T.hosp+T.comb+T.outras;
  T.adi=T.advV+T.advC+T.advO;
  T.diff=(kmVal+T.desp)-T.adi;
  T.verdict=T.diff>0?"Colaborador receberá da Semear":(T.diff<0?"Crédito Semear":"Contas zeradas");
  return T;
}
function updateTotals(){
  var T=totals();

    kmBoth:fmtN(T.kmTot)+" km · "+brl(T.kmVal)};
  $$("[data-t]").forEach(function(el){var k=el.getAttribute("data-t");if(k in out)el.textContent=out[k]});
  var st=T.diff>0?"pos":(T.diff<0?"neg":"");
  $$("[data-t=diff],[data-verdict]").forEach(function(el){if(st)el.setAttribute("data-state",st);else el.removeAttribute("data-state")});

  updateIdentSum();
}

}

/* ---------- renderização ---------- */
function fieldHTML(sec,i,r,f){
  var cls="f"+((f.t==="text")?" wide":""), st=' style="--s:'+f.s+'"', id=sec+"-"+i+"-"+f.k;

  if(f.t==="calc")return '<div class="'+cls+'"'+st+'>'+lab+'<output data-calc="'+f.k+'">'+esc(f.calc(r))+'</output></div>';
  var v=r[f.k], at=' id="'+id+'" data-sec="'+sec+'" data-i="'+i+'" data-k="'+f.k+'"';

  if(f.t==="sel")inner='<select'+at+'>'+f.opts.map(function(o){return '<option'+(o===v?" selected":"")+'>'+o+'</option>'}).join("")+'</select>';
  else{
    var type=f.t==="date"?"date":(f.t==="text"?"text":"number");

    if(f.list)extra+=' list="'+f.list+'"';
    if(f.t==="text")extra+=' autocomplete="off"';
    inner='<input type="'+type+'"'+at+extra+' value="'+esc(v)+'">';
  }
  return '<label class="'+cls+'"'+st+' for="'+id+'">'+lab+inner+'</label>';
}

}
function secHTML(sec){

}
function resumoHTML(){
  var line=function(a,b){return '<div class="line"><span>'+a+'</span><span class="num" data-t="'+b+'"></span></div>'};
  return '<div class="eq">'+
    '<div class="card"><h3>(1) Quilometragem</h3><div class="big" data-t="kmVal"></div>'+line("Km rodado","km")+'</div>'+
    '<div class="card"><h3>(2) Despesas</h3><div class="big" data-t="desp"></div>'+line("Alimentação","alim")+line("Hospedagem","hosp")+line("Combustível","comb")+line("Outras","outras")+'</div>'+
    '<div class="card"><h3>(3) Adiantamentos</h3><div class="big" data-t="adi"></div>'+line("Viagem","advV")+line("Combustível","advC")+line("Outras despesas","advO")+'</div>'+
    '<div class="result"><span>Diferença [(1 + 2) − 3]</span><div class="big" data-t="diff" data-verdict></div><div class="verdict" data-t="verdict" data-verdict></div></div></div>'+
    '<div class="actions"><button type="button" class="btn" data-act="export">Baixar em Excel</button>'+
    '<button type="button" class="btn ghost" data-act="clear">Limpar todos os lançamentos</button></div>';
}
function renderAll(){
  $("#tabs").innerHTML=TABS.map(function(t,i){return '<button type="button" role="tab" id="tab-'+t.id+'" data-act="tab" data-tab="'+t.id+'" aria-selected="'+(i===current?"true":"false")+'">'+t.label+'</button>'}).join("");
  $("#app").innerHTML=TABS.map(function(t,i){
    return '<div role="tabpanel" data-panel="'+t.id+'" aria-labelledby="tab-'+t.id+'"'+(i===current?"":" hidden")+'>'+'<div style="display:grid;gap:22px">'+(t.id==="res"?resumoHTML():t.secs.map(secHTML).join(""))+'</div>'+'</div>';
  }).join("")+'<datalist id="tiposComb"><option value="Gasolina comum"><option value="Etanol"><option value="Diesel S10"><option value="Diesel S500"></datalist>';
  updateTotals();
}
function renderIdent(){
  var H=S.h;
  var fld=function(k,l,t,s,h){return '<label class="f'+(h?" half":"")+'" style="--s:'+s+'" for="h-'+k+'"><span>'+l+'</span><input id="h-'+k+'" type="'+t+'" data-h="'+k+'" value="'+esc(H[k])+'"></label>'};
  $("#identForm").innerHTML=fld("regional","Regional","text",3)+fld("unidade","Unidade","text",5)+fld("motorista","Motorista / responsável técnico","text",4)+
    fld("veiculo","Veículo","text",4)+fld("placa","Placa","text",2,1)+fld("de","Período de","date",3,1)+fld("ate","até","date",3,1);
}
var current=0;

/* ---------- eventos ---------- */
var armed=null;
function disarm(){if(armed){armed.btn.classList.remove("arm");armed.btn.textContent=armed.txt;clearTimeout(armed.t);armed=null}}
function confirmTwice(btn,txt,fn){
  if(armed&&armed.btn===btn){disarm();fn();return}
  disarm();armed={btn:btn,txt:btn.textContent,t:setTimeout(disarm,3500)};
  btn.classList.add("arm");btn.textContent=txt;
}
function newRow(sec){
  var rows=S[sec],last=rows[rows.length-1],r={};
  SEC[sec].fields.forEach(function(f){if(f.t!=="calc")r[f.k]=""});
  var d=last&&last.data?last.data:S.h.de;
  if(sec==="km"){r.data=last&&last.data?addDays(last.data,1):S.h.de;r.ini=last&&isSet(last.fim)?last.fim:"";r.servico="AMOSTRAGEM";r.real="Sim"}
  else r.data=d;
  if(sec==="comb")r.placa=S.h.placa;
  if(sec==="outras")r.placa=S.h.placa;
  if(sec==="alim")r.qtde=1;
  return r;
}
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.hasAttribute("data-h")){S.h[t.getAttribute("data-h")]=t.value;changed();return}
  var sec=t.getAttribute("data-sec");if(!sec)return;
  var i=+t.getAttribute("data-i"),k=t.getAttribute("data-k"),r=S[sec][i];if(!r)return;
  r[k]=t.value;
  if(sec==="comb"&&(k==="qtd"||k==="vpl")&&num(r.qtd)>0&&num(r.vpl)>0){
    r.valor=(Math.round(num(r.qtd)*num(r.vpl)*100)/100).toString();
    var vi=$("#comb-"+i+"-valor");if(vi)vi.value=r.valor;
  }
  var row=t.closest(".row");
  if(row)SEC[sec].fields.forEach(function(f){if(f.t==="calc"){var o=$("[data-calc="+f.k+"]",row);if(o)o.textContent=f.calc(r)}});
  changed();
});
document.addEventListener("change",function(e){if(e.target.tagName==="SELECT")e.target.dispatchEvent(new Event("input",{bubbles:true}))});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act"),sec=b.getAttribute("data-sec");
  if(act==="tab"){
    disarm();current=TABS.findIndex(function(t){return t.id===b.getAttribute("data-tab")});
    $$("[data-act=tab]").forEach(function(x,i){x.setAttribute("aria-selected",i===current?"true":"false")});
    $$("[data-panel]").forEach(function(p,i){p.hidden=i!==current});
    window.scrollTo(0,0);
  }else if(act==="add"){
    disarm();S[sec].push(newRow(sec));var i=S[sec].length-1;
    renderAll();changed();var f=$("#"+sec+"-"+i+"-"+(sec==="km"?"ini":"data"));if(f)f.focus({preventScroll:false});
  }else if(act==="del"){
    var i2=+b.getAttribute("data-i");
    confirmTwice(b,"Confirmar?",function(){S[sec].splice(i2,1);renderAll();changed()});
  }else if(act==="clear"){
    confirmTwice(b,"Toque de novo para limpar",function(){["km","alim","hosp","comb","outras","advV","advC","advO"].forEach(function(s){S[s]=[]});renderAll();changed();toast("Lançamentos removidos.")});
  }else if(act==="export"){exportXlsx()}
});

/* ---------- salvar ---------- */
var docRef=null,saveT=null;
function setStatus(t,busy){var s=$("#status");s.textContent=t;s.classList.toggle("busy",!!busy)}
function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3500)}
function changed(){S.updated=Date.now();updateTotals();setStatus("Salvando…",true);clearTimeout(saveT);saveT=setTimeout(persist,700)}
function persist(){
  var json=JSON.stringify(S),local=true;
  try{localStorage.setItem(KEY,json)}catch(e){local=false}
  if(docRef){
    docRef.set({json:json,updated:S.updated}).then(function(){setStatus("Salvo na sua conta")},function(){setStatus(local?"Salvo neste aparelho":"Não foi possível salvar",!local)});
  }else setStatus(local?"Salvo neste aparelho":"Não foi possível salvar",!local);
}
function cloudSync(){
  if(!window.claude||!window.claude.use){setStatus("Salvo neste aparelho");return}
  Promise.all([window.claude.use("user"),window.claude.use("db")]).then(function(r){
    var user=r[0],db=r[1];if(!user||!db){setStatus("Salvo neste aparelho");return}
    return user.id().then(function(id){
      if(!id){setStatus("Salvo neste aparelho");return}
      docRef=db.doc("data/users/"+id+"/relatorio");
      return docRef.get().then(function(snap){
        var rem=snap.exists?snap.data():null;
        if(rem&&rem.json&&(rem.updated||0)>(S.updated||0)){
          try{S=JSON.parse(rem.json);try{localStorage.setItem(KEY,rem.json)}catch(e){}renderIdent();renderAll();setStatus("Salvo na sua conta");return}catch(e){}
        }
        persist();
      });
    });
  }).catch(function(){setStatus("Salvo neste aparelho")});
}

/* ---------- exportar para Excel (preenche o modelo original) ---------- */
var NS="http://schemas.openxmlformats.org/spreadsheetml/2006/main",XMLNS="http://www.w3.org/XML/1998/namespace";
var C=function(col,key,ty){return [col,key,ty]};
var XL=[
  {sheet:0,sec:"km",r0:10,n:16,cols:[C("A","data","d"),C("D","ini","n"),C("F","fim","n"),C("K","cliente","s"),C("P","municipio","s"),C("T","servico","s"),C("AF","real","r"),C("AI","@placa","s")]},
  {sheet:1,sec:"alim",r0:11,n:26,cols:[C("A","data","d"),C("D","nf","nf"),C("G","cidade","s"),C("K","estab","s"),C("P","desc","s"),C("Y","qtde","n"),C("AB","valor","n")]},
  {sheet:1,sec:"hosp",r0:41,n:7,cols:[C("A","data","d"),C("D","nf","nf"),C("G","cidade","s"),C("K","consumo","s"),C("R","desc","s"),C("Y","qtde","n"),C("AB","valor","n")]},
  {sheet:1,sec:"comb",r0:52,n:7,cols:[C("A","data","d"),C("D","posto","s"),C("G","kmAtual","n"),C("K","placa","s"),C("N","tipo","s"),C("R","qtd","n"),C("Y","vpl","n"),C("AB","valor","n")]},
  {sheet:1,sec:"outras",r0:63,n:10,cols:[C("A","data","d"),C("D","nf","nf"),C("G","cidade","s"),C("K","placa","s"),C("R","desc","s"),C("Y","qtde","n"),C("AB","valor","n")]},
  {sheet:2,sec:"advV",r0:12,n:4,cols:[C("A","data","d"),C("D","conta","s"),C("G","nome","s"),C("K","tipo","s"),C("Q","fav","s"),C("U","valor","n")]},
  {sheet:2,sec:"advC",r0:20,n:15,cols:[C("A","data","d"),C("D","nf","nf"),C("G","forn","s"),C("K","desc","s"),C("R","qt","n"),C("U","valor","n")]},
  {sheet:2,sec:"advO",r0:39,n:8,cols:[C("A","data","d"),C("D","nf","nf"),C("G","forn","s"),C("K","desc","s"),C("R","qt","n"),C("U","valor","n")]}
];
function serial(iso){if(!iso)return "";var p=iso.split("-");return Math.round((Date.UTC(+p[0],+p[1]-1,+p[2])-Date.UTC(1899,11,30))/86400000)}
function conv(ty,v){
  if(ty==="d")return serial(v);
  if(ty==="n")return isSet(v)&&v!==""?num(v):"";
  if(ty==="nf")return /^\d{1,10}$/.test(String(v||""))?+v:(v||"");
  if(ty==="r")return v==="Sim"?"s":(v==="Não"?"n":"");
  return v==null?"":String(v);
}
function sheetEditor(xml){
  var doc=new DOMParser().parseFromString(xml,"application/xml"),map={},cs=doc.getElementsByTagName("c");
  for(var i=0;i<cs.length;i++)map[cs[i].getAttribute("r")]=cs[i];
  return {
    set:function(ref,v){
      var c=map[ref];if(!c)return;
      while(c.firstChild)c.removeChild(c.firstChild);
      c.removeAttribute("t");
      if(v===""||v==null)return;
      if(typeof v==="number"){var e=doc.createElementNS(NS,"v");e.textContent=String(v);c.appendChild(e)}
      else{c.setAttribute("t","inlineStr");var is=doc.createElementNS(NS,"is"),t=doc.createElementNS(NS,"t");t.setAttributeNS(XMLNS,"xml:space","preserve");t.textContent=v;is.appendChild(t);c.appendChild(is)}
    },
    out:function(){
      for(var i=0;i<cs.length;i++){var c=cs[i];
        if(c.getElementsByTagName("f").length){var vs=c.getElementsByTagName("v");while(vs.length)c.removeChild(vs[0]);c.removeAttribute("t")}}
      var x=new XMLSerializer().serializeToString(doc);
      return x.indexOf("<?xml")===0?x:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+x;
    }
  };
}
function buildXlsx(){
  var bin=atob($("#tplData").textContent.replace(/\s+/g,"")),u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  var names=["xl/worksheets/sheet1.xml","xl/worksheets/sheet2.xml","xl/worksheets/sheet3.xml"],H=S.h,over=[];
  return JSZip.loadAsync(u).then(function(zip){
    return Promise.all(names.map(function(n){return zip.file(n).async("string")})).then(function(xs){
      var E=xs.map(sheetEditor);
      var uni="Unidade "+H.unidade;
      E[0].set("L3",uni);E[0].set("C5",H.regional);E[0].set("C7",H.motorista);E[0].set("N7",H.veiculo);E[0].set("T7",H.placa);
      E[0].set("Z7",serial(H.de));E[0].set("AF7",serial(H.ate));E[0].set("T27",num(H.valorKm));
      E[1].set("C5",H.regional);E[1].set("V5",serial(H.de));E[1].set("AA5",serial(H.ate));
      E[2].set("H3",uni);
      XL.forEach(function(T){
        var rows=S[T.sec];
        if(rows.length>T.n)over.push(SEC[T.sec].title+" ("+(rows.length-T.n)+" a mais)");
        for(var k=0;k<T.n;k++){
          var r=rows[k];
          T.cols.forEach(function(c){E[T.sheet].set(c[0]+(T.r0+k),r?conv(c[2],c[1]==="@placa"?H.placa:r[c[1]]):"")});
        }
      });
      names.forEach(function(n,i){zip.file(n,E[i].out())});
      return zip.file("xl/workbook.xml").async("string").then(function(w){
        zip.file("xl/workbook.xml",w.replace(/<calcPr[^>]*\/>/,'<calcPr calcId="191028" fullCalcOnLoad="1"/>'));
        return zip.generateAsync({type:"uint8array",compression:"DEFLATE"}).then(function(d){return {data:d,over:over}});
      });
    });
  });
}
window.__kdBuild=buildXlsx;
var MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
function toB64(u8){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(",")[1])};fr.readAsDataURL(new Blob([u8]))})}
function deliver(name,u8){
  if(window.AndroidApp&&window.AndroidApp.saveFile)return toB64(u8).then(function(b){window.AndroidApp.saveFile(name,b)});
  var url=URL.createObjectURL(new Blob([u8],{type:MIME})),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove()},4000);
  return Promise.resolve();
}
function exportXlsx(){
  if(typeof JSZip==="undefined"){toast("Não foi possível carregar o gerador de Excel.");return}
  var H=S.h,name="relatorio-km-despesas-"+(H.placa||"veiculo").toLowerCase()+"-"+(H.de||"").slice(0,7)+".xlsx";
  buildXlsx().then(function(res){
    return deliver(name,res.data).then(function(){
      toast(res.over.length?"Arquivo gerado. Não couberam no modelo: "+res.over.join("; "):"Arquivo gerado: "+name);
    });
  }).catch(function(){toast("Não foi possível gerar o arquivo.")});
}

renderIdent();renderAll();cloudSync();
})();
</script>
